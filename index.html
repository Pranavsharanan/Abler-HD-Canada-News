<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Abler HD Canada News - Your trusted source for Canadian news.">
    <title>AbleRHDCanadaNews</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="favicon.png">
</head>
<body>
    <!-- Header -->
    <header>
        <div class="logo">
            <h1>Abler HD Canada News</h1>
        </div>
        <nav>
            <ul>
                <li><a href="#home">Home</a></li>
                <li><a href="#canada">Canada</a></li>
                <li><a href="#world">World</a></li>
                <li><a href="#health">Health</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
        <div class="accessibility">
            <button id="high-contrast">Toggle High Contrast</button>
            <button id="text-size">Larger Text</button>
        </div>
    </header>

    <!-- Breaking News Ticker -->
    <section class="ticker">
        <div class="ticker-content">
            <span>Breaking News: Stay updated with the latest Canadian stories!</span>
        </div>
    </section>

    <!-- Main Content -->
    <main>
        <section class="featured">
            <h2>Featured Stories</h2>
            <div id="news-container" class="news-grid"></div>
        </section>
        <section class="newsletter">
            <h2>Subscribe to Our Newsletter</h2>
            <form id="newsletter-form">
                <input type="email" placeholder="Enter your email" required>
                <button type="submit">Subscribe</button>
            </form>
        </section>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2025 Abler HD Canada News. All rights reserved.</p>
        <div class="social-links">
            <a href="https://x.com">X</a>
            <a href="#">Email</a>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
